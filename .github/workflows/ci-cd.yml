name: CI-CD

on:
  push:

# This environment variable forces all JavaScript actions to use Node.js 24, 
# which resolves the deprecation warning you are seeing.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # The checkout action that was triggering the warning
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # --- Your other build steps go below ---
      
      # Example step (replace with your actual build commands)
      - name: Build project
        run: echo "Building the project..."
